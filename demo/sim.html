<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aitt-map traffic playback</title>
  <link rel="preload" href="/fonts/Overpass%20SemiBold/0-255.pbf" as="fetch" crossorigin>
  <style>
    html,body{margin:0;height:100%;background:#0b0d10}#map{position:absolute;inset:0}
    .aitt-layer-panel.aitt-sim{top:auto;left:auto;right:10px;bottom:34px;width:250px}
    .aitt-layer-panel.aitt-sim .aitt-layer-body{display:grid}
    .aitt-sim-row{display:flex;gap:10px;align-items:center}
    .aitt-sim-row .aitt-seg-btn{background:var(--p-on);color:#05070A;padding:6px 14px;flex:none}
    .aitt-sim-row .aitt-layer-line{flex:1}
    .aitt-sim-legend{display:flex;gap:10px;font-size:12px;color:var(--p-muted)}
    .aitt-sim-legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:-1px}
    .aitt-sim-count{font-size:11.5px;color:var(--p-muted)}
  </style>
</head>
<body>
  <div id="map"></div>
  <script type="module" src="./sim.js"></script>
</body>
</html>
